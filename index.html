  <h1>Opus 5.5 Motion Graphics Library</h1>
  <p class="subtitle">Paste X post links, videos stream live from X. Data is saved in this browser.</p>

  </div>
  <div class="status" id="status"></div>

  <div class="controls">
    <button id="foldToggle" aria-pressed="false">Unfold all</button>
    <button id="toggleAdd">+ Add manually</button>
    <button id="refreshAll" title="Re-fetch video links, posters and likes from X">Refresh from X</button>
    <button id="exportBtn">Export JSON</button>
    <label class="file-label">
      Import JSON
      <input type="file" id="importFile" accept=".json" hidden>
    </label>  </div>

  <div class="add-form" id="addForm">
    <h3>Add a video manually</h3>
    <div class="form-grid">
      <input id="fTitle" placeholder="Title" required>
      <input id="fAuthor" placeholder="Author (@handle)">
      <input id="fLikes" type="number" placeholder="Likes" min="0">
      <input id="fPost" placeholder="X post URL">
      <input id="fVideo" placeholder="Direct MP4 URL (video.twimg.com/...)" required>
      <input id="fPoster" placeholder="Poster image URL (optional)">
      <textarea id="fDesc" placeholder="Short description"></textarea>
    </div>
    <div class="form-actions">
      <button id="saveVideo">Save video</button>
      <button id="cancelAdd" type="button">Cancel</button>
    </div>
  </div>

  <section class="ext" id="extSection">
    <div class="ext-head">
      <h2>External libraries <span id="extCount"></span></h2>
      <button id="toggleExtAdd">+ Add library</button>
    </div>
    <div class="add-form" id="extForm">
      <div class="form-grid">
        <input id="extUrl" placeholder="Website URL (https://…)" required>
        <input id="extName" placeholder="Name (optional, defaults to the domain)">
        <input id="extImage" placeholder="Preview image URL (optional)">
        <textarea id="extNote" placeholder="What's in it? (optional)"></textarea>
      </div>
      <div class="form-actions">
        <button id="saveExt">Save library</button>
        <button id="cancelExt" type="button">Cancel</button>
      </div>
    </div>
    <div class="ext-grid" id="extList"></div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Filter by title, author, description…">
    <span class="count" id="count"></span>
  </div>

  <div class="grid" id="library"></div>

  <div class="modal-backdrop" id="promptModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle"></h3>
        <button id="closeModal" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <section>
          <div class="modal-section-head">
            <h4>Workflow</h4>
            <span class="hint" id="workflowHint"></span>
            <button id="copyRebuild" class="primary">Copy as rebuild prompt</button>
          </div>
          <div class="tags" id="modalTags"></div>
        </section>
        <section>
          <div class="modal-section-head">
            <h4>Prompt</h4>
            <span class="hint" id="promptHint"></span>
            <button id="copyPrompt">Copy prompt</button>
          </div>
          <textarea id="promptText" placeholder="No prompt found in the post or the author's thread. Paste one here — it's saved with this video."></textarea>
        </section>
        <section>
          <div class="modal-section-head">
            <h4>Post &amp; author thread</h4>
            <span class="hint"></span>
            <button id="copyThread">Copy all</button>
          </div>
          <div id="threadBox"></div>
        </section>
      </div>
    </div>
  </div>

    // ---------- storage ----------

    function loadVideos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : defaultVideos.map(v => ({ ...v }));
      } catch {
        return defaultVideos.map(v => ({ ...v }));
      }
    }

    function saveVideos(list) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch {}
    }

    let videos = loadVideos();

    // Starter set grows over time: merge new starter videos into an existing library once per seed version
    const SEED_KEY = 'opus55-motion-library-seed';
    const SEED_VERSION = 3;
    try {
      if ((Number(localStorage.getItem(SEED_KEY)) || 0) < SEED_VERSION) {
        const have = new Set(videos.map(v => v.id));
        const added = defaultVideos.filter(d => !have.has(d.id)).map(d => ({ ...d }));
        if (added.length) { videos = [...added, ...videos]; saveVideos(videos); }
        localStorage.setItem(SEED_KEY, String(SEED_VERSION));
      }
    } catch {}

    // Fold state is a per-browser convenience: cards start folded, unfolded ids are remembered
    const OPEN_KEY = 'opus55-motion-library-open';
    const openIds = new Set((() => {
      try { return JSON.parse(localStorage.getItem(OPEN_KEY)) || []; } catch { return []; }
    })());
    function saveOpenIds() {
      try { localStorage.setItem(OPEN_KEY, JSON.stringify([...openIds])); } catch {}
    }
    function setAllFolded(folded) {
      openIds.clear();
      if (!folded) videos.forEach(v => openIds.add(v.id));
      saveOpenIds();
      document.querySelectorAll('.card').forEach(card => {
        card.classList.toggle('folded', folded);
        card.querySelector('.fold-bar').setAttribute('aria-expanded', !folded);
      });
      updateFoldToggle();
    }

    // One button: unfolds everything while any card is folded, folds everything once all are open
    function updateFoldToggle() {
      const cards = [...document.querySelectorAll('.card')];
      const allOpen = cards.length > 0 && cards.every(c => !c.classList.contains('folded'));
      const btn = document.getElementById('foldToggle');
      btn.textContent = allOpen ? 'Fold all' : 'Unfold all';
      btn.setAttribute('aria-pressed', allOpen);
    }

    function commit(list) {
      videos = list;
      saveVideos(videos);
      render();
    }

    // ---------- X resolver (fxtwitter, vxtwitter fallback) ----------

    function parsePostUrl(url) {
      const m = String(url).match(/(?:x|twitter|fxtwitter|vxtwitter|fixupx)\.com\/([^/?#]+)\/status(?:es)?\/(\d+)/i);
      return m ? { user: m[1], id: m[2] } : null;
    }

    function titleFromText(text) {
      const line = (text || '').replace(/https?:\/\/\S+/g, '').split('\n').map(s => s.trim()).find(Boolean) || 'Untitled';
      return line.length > 70 ? line.slice(0, 67).trimEnd() + '…' : line;
    }

    function pickMp4(formats, fallback) {
      const mp4s = (formats || [])
        .filter(f => f.container === 'mp4' || /\.mp4/.test(f.url))
        .map(f => ({ url: f.url, width: Number((f.url.match(/\/(\d+)x\d+\//) || [])[1]) || 0, bitrate: f.bitrate || 0 }));
      if (!mp4s.length) return fallback;
      const fitting = mp4s.filter(f => f.width && f.width <= MAX_GRID_WIDTH);
      const pool = fitting.length ? fitting : mp4s;
      pool.sort((a, b) => (b.width - a.width) || (b.bitrate - a.bitrate));
      return pool[0].url;
    }

    async function fetchFx(user, id) {
      const res = await fetch(`https://api.fxtwitter.com/${user}/status/${id}`);
      if (!res.ok) throw new Error(`fxtwitter ${res.status}`);
      const { tweet } = await res.json();
      if (!tweet) throw new Error('fxtwitter: no tweet');
      const clips = (tweet.media && tweet.media.videos) || [];
      return clips.map((v, i) => ({
        id: clips.length > 1 ? `${tweet.id}-${i}` : tweet.id,
        title: titleFromText(tweet.text),
        author: '@' + tweet.author.screen_name,
        post: tweet.url,
        video: pickMp4(v.formats, v.url),
        poster: v.thumbnail_url || '',
        duration: v.duration || 0,
        width: v.width, height: v.height,
        likes: tweet.likes || 0,
        desc: tweet.text || ''
      }));
    }

    async function fetchVx(user, id) {
      const res = await fetch(`https://api.vxtwitter.com/${user}/status/${id}`);
      if (!res.ok) throw new Error(`vxtwitter ${res.status}`);
      const t = await res.json();
      const clips = (t.media_extended || []).filter(m => m.type === 'video' || m.type === 'gif');
      return clips.map((m, i) => ({
        id: clips.length > 1 ? `${t.tweetID}-${i}` : t.tweetID,
        title: titleFromText(t.text),
        author: '@' + t.user_screen_name,
        post: t.tweetURL,
        video: m.url,
        poster: m.thumbnail_url || '',
        duration: m.duration_millis ? m.duration_millis / 1000 : 0,
        width: m.size && m.size.width, height: m.size && m.size.height,
        likes: t.likes || 0,
        desc: t.text || ''
      }));
    }

    // Prompts usually sit in the author's own replies ("prompt in the replies"), so read the self-thread
    function extractPrompt(posts) {
      const [main, ...rest] = posts;
      const hits = rest.filter(t => /prompt/i.test(t));
      if (hits.length) return hits.join('\n\n');
      const label = main ? main.search(/prompt\s*[:：]/i) : -1;
      return label >= 0 ? main.slice(label) : '';
    }

    // ---------- tools & workflow detection ----------

    // Extend this list when a new tool shows up — tags are recomputed on every render
    const TOOL_TAGS = [
      ['Opus', /\bopus\b/i],
      ['Claude Code', /claude\s?code/i],
      ['Remotion', /remotion/i],
      ['HyperFrames', /hyper\s?frames/i],
      ['Seedance', /seedance/i],
      ['Kling', /\bkling\b/i],
      ['Veo', /\bveo\b/i],
      ['Sora', /\bsora\b/i],
      ['Runway', /runway/i],
      ['Higgsfield', /higgsfield/i],
      ['Midjourney', /midjourney/i],
      ['Nano Banana', /nano[\s-]?banana/i],
      ['GPT Image', /gpt[\s-]?image/i],
      ['Flux', /\bflux\b/i],
      ['Gemini', /gemini/i],
      ['ElevenLabs', /eleven\s?labs/i],
      ['Suno', /\bsuno\b/i],
      ['Voice / TTS', /local voice|voice model|\btts\b|text[\s-]to[\s-]speech/i],
      ['After Effects', /after effects/i],
      ['Blender', /blender/i],
      ['Three.js', /three\.?js/i],
      ['GSAP', /\bgsap\b/i],
      ['Lottie', /lottie/i],
      ['Rive', /\brive\b/i],
      ['Figma', /figma/i],
      ['CapCut', /capcut/i],
      ['Premiere', /premiere pro|\bpremiere\b/i],
      ['DaVinci', /davinci/i],
      ['ffmpeg', /ffmpeg/i],
      ['REA', /\bREA\b/],
      ['Parallel agents', /parallel agents?|sub-?agents?|multi-?agent/i],
      ['Revise loop', /revis(e|ion) loop|feedback loop|review loop|self-?review/i],
      ['Pure code', /pure code|just code|from code|in code\b|code only/i],
      ['Beat sync', /to the beat|beat[\s-]?sync|on the beat/i],
      ['Style spec', /style specs?|design system|brand kit/i]
    ];

    function textOf(v) {
      return [v.title, v.desc, ...(v.thread || [])].join('\n');
    }

    function tagsOf(v) {
      const text = textOf(v);
      return TOOL_TAGS.filter(([, re]) => re.test(text)).map(([label]) => label);
    }

    // prompt > workflow > plain post. Opus is in nearly every post here, so it doesn't count as a signal.
    function kindOf(v, tags = tagsOf(v)) {
      if (v.prompt) return 'prompt';
      const tools = tags.filter(t => t !== 'Opus').length;
      const steps = /\bthen\b|→|->|\bstep\s*\d|^\s*\d+[.)]\s/im.test(textOf(v));
      return tools >= 2 || (tools >= 1 && steps) ? 'workflow' : 'post';
    }

    function rebuildPrompt(v) {
      const tags = tagsOf(v);
      return [
        'Reconstruct the workflow behind this X post as a reproducible, step-by-step production pipeline.',
        '',
        `Source: ${v.post || '(no link)'}${v.author ? ` by ${v.author}` : ''}`,
        `Detected tools/techniques: ${tags.length ? tags.join(', ') : 'none detected'}`,
        '',
        'Post and author thread:',
        '"""',
        threadOf(v).join('\n\n'),
        '"""',
        ...(v.prompt ? ['', 'Prompt shared by the author:', '"""', v.prompt, '"""'] : []),
        '',
        'Deliver:',
        '1. Tool chain in order — what each tool does in this pipeline',
        '2. Steps, each as input → action → output',
        "3. The prompt(s) per step — quote the author's where given, draft the rest and mark them as drafted",
        "4. Open questions — what the post doesn't reveal and how to test it"
      ].join('\n');
    }

    async function fetchThread(id) {
      try {
        const res = await fetch(`https://api.fxtwitter.com/2/thread/${id}`);
        if (!res.ok) return null;
        const d = await res.json();
        const author = d.status && d.status.author && d.status.author.screen_name;
        let posts = (d.thread || []).filter(s => s.author && s.author.screen_name === author).map(s => s.text || '');
        if (!posts.length && d.status) posts = [d.status.text || ''];
        if (posts.length <= 1) {
          // Prompt reply not chained to the post: look for it among the author's replies
          const c = await fetch(`https://api.fxtwitter.com/2/conversation/${id}`);
          if (c.ok) {
            const cd = await c.json();
            posts = posts.concat((cd.replies || [])
              // Skip the author's chats with others ("@someone thanks, will improve my prompts")
              .filter(s => s.author && s.author.screen_name === author && !/^@\w+/.test(s.text || '')
                && /prompt/i.test(s.text || '') && (s.text || '').length > 80)
              .map(s => s.text));
          }
        }
        return { thread: posts, prompt: extractPrompt(posts) };
      } catch {
        return null;
      }
    }

    async function resolvePost(url) {
      const p = parsePostUrl(url);
      if (!p) throw new Error('Not an X post URL');
      let results;
      try {
        results = await fetchFx(p.user, p.id);
      } catch (err) {
        results = await fetchVx(p.user, p.id);
      }
      const t = await fetchThread(p.id);
      if (t) results.forEach(r => { r.thread = t.thread; r.prompt = t.prompt; });
      return results;
    }

    // ---------- rendering ----------

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeUrl(url) {
      return /^https?:\/\//i.test(url || '') ? escapeHtml(url) : '';
    }

    function fmtDuration(s) {
      if (!s) return '';
      s = Math.round(s);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function setStatus(msg, isError = false) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.classList.toggle('error', isError);
    }

    function render() {
      const container = document.getElementById('library');
      const q = document.getElementById('search').value.trim().toLowerCase();
      const shown = q
        ? videos.filter(v => [v.title, v.author, v.desc, ...tagsOf(v)].join(' ').toLowerCase().includes(q))
        : videos;

      document.getElementById('count').textContent =
        q ? `${shown.length} of ${videos.length} videos` : `${videos.length} videos`;
      document.getElementById('total').textContent = videos.length;
      document.getElementById('totalLabel').textContent = videos.length === 1 ? 'video in the library' : 'videos in the library';

      if (!shown.length) {
        container.innerHTML = `<div class="empty">${videos.length ? 'No matches.' : 'No videos yet. Paste an X post link above.'}</div>`;
        return;
      }

      const BUTTON = { prompt: ['has', 'View prompt'], workflow: ['wf', 'View workflow'], post: ['', 'Post & thread'] };
      container.innerHTML = shown.map(v => {
        const tags = tagsOf(v);
        const [btnClass, btnLabel] = BUTTON[kindOf(v, tags)];
        return `
        <div class="card ${openIds.has(v.id) ? '' : 'folded'}" data-id="${escapeHtml(v.id)}">
          <div class="player">
            <video controls muted loop playsinline preload="${v.poster ? 'none' : 'metadata'}"
              ${v.poster ? `poster="${safeUrl(v.poster)}"` : ''} src="${safeUrl(v.video)}"></video>
            ${v.duration ? `<span class="duration">${fmtDuration(v.duration)}</span>` : ''}
          </div>
          <button class="fold-bar" aria-expanded="${openIds.has(v.id)}" aria-label="Show or hide details">
            <span class="fold-title">${escapeHtml(v.title)}</span>
            <span class="chevron" aria-hidden="true">▾</span>
          </button>
          <div class="info">
            <h3>${escapeHtml(v.title)}</h3>
            <div class="meta">
              <span>${escapeHtml(v.author || '')} ${safeUrl(v.post) ? `· <a href="${safeUrl(v.post)}" target="_blank" rel="noopener">Post</a>` : ''}</span>
              <span class="likes">♥ ${Number(v.likes) || 0}</span>
            </div>
            <div class="desc">${escapeHtml(v.desc || '')}</div>
            <div class="tags">${tags.map(t => `<button class="tag" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}</div>
            <div class="card-actions">
              <button class="prompt-btn ${btnClass}" data-id="${escapeHtml(v.id)}">${btnLabel}</button>
              <button class="remove-btn" data-id="${escapeHtml(v.id)}">Remove</button>
            </div>
          </div>
        </div>`;
      }).join('');

      container.querySelectorAll('.card').forEach(card => {
        const video = card.querySelector('video');
        const id = card.dataset.id;
        let userEngaged = false;

        // Hover preview: muted autoplay while the pointer is over the card
        card.addEventListener('mouseenter', () => { if (!userEngaged) video.play().catch(() => {}); });
        card.addEventListener('mouseleave', () => { if (!userEngaged) video.pause(); });
        // Once the user interacts with the controls, hand over playback (sound, no auto-pause)
        video.addEventListener('volumechange', () => { if (!video.muted) userEngaged = true; });
        video.addEventListener('seeking', () => { userEngaged = true; });

        // Expired or blocked link: re-resolve once from the post URL
        video.addEventListener('error', () => repairVideo(id), { once: true });
      });

      container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => commit(videos.filter(v => v.id !== btn.dataset.id)));
      });
      container.querySelectorAll('.prompt-btn').forEach(btn => {
        btn.addEventListener('click', () => openPrompt(btn.dataset.id));
      });
      // Toggle in place (no re-render) so a playing video keeps playing
      container.querySelectorAll('.fold-bar').forEach(bar => {
        bar.addEventListener('click', () => {
          const card = bar.closest('.card');
          const open = card.classList.toggle('folded') === false;
          bar.setAttribute('aria-expanded', open);
          open ? openIds.add(card.dataset.id) : openIds.delete(card.dataset.id);
          saveOpenIds();
          updateFoldToggle();
        });
      });
      updateFoldToggle();
      container.querySelectorAll('.tag').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('search').value = btn.dataset.tag;
          render();
          window.scrollTo({ top: document.querySelector('.toolbar').offsetTop - 16 });
        });
      });
    }

    // ---------- prompt modal ----------

    let modalId = null;

    function threadOf(v) {
      return v.thread && v.thread.length ? v.thread : [v.desc || ''];
    }

    function openPrompt(id) {
      const v = videos.find(x => x.id === id);
      if (!v) return;
      modalId = id;
      document.getElementById('modalTitle').textContent = v.title;
      document.getElementById('promptText').value = v.prompt || '';
      document.getElementById('promptHint').textContent =
        v.promptEdited ? 'edited by you' : v.prompt ? 'found in the author’s thread' : '';
      const tags = tagsOf(v);
      document.getElementById('modalTags').innerHTML = tags.length
        ? tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
        : '<span class="hint">No known tools detected.</span>';
      document.getElementById('workflowHint').textContent =
        'paste into Claude to get the step-by-step recipe';
      document.getElementById('threadBox').innerHTML = threadOf(v)
        .map(t => `<div class="thread-text">${escapeHtml(t)}</div>`).join('') +
        (safeUrl(v.post) ? `<p class="meta"><a href="${safeUrl(v.post)}" target="_blank" rel="noopener">Open post on X</a></p>` : '');
      document.getElementById('promptModal').classList.add('open');
      document.getElementById(v.prompt ? 'copyPrompt' : 'copyRebuild').focus();
    }

    function closePrompt() {
      if (!modalId) return;
      modalId = null;
      document.getElementById('promptModal').classList.remove('open');
      render();
    }

    async function copyText(text, btn) {
      const label = btn.textContent;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      btn.textContent = 'Copied ✓';
      setTimeout(() => { btn.textContent = label; }, 1500);
    }

    document.getElementById('promptText').addEventListener('input', (e) => {
      videos = videos.map(v => v.id === modalId ? { ...v, prompt: e.target.value, promptEdited: true } : v);
      saveVideos(videos);
      document.getElementById('promptHint').textContent = 'edited by you';
    });
    document.getElementById('copyPrompt').addEventListener('click', (e) => {
      const text = document.getElementById('promptText').value;
      if (text) copyText(text, e.target);
    });
    document.getElementById('copyRebuild').addEventListener('click', (e) => {
      const v = videos.find(x => x.id === modalId);
      if (v) copyText(rebuildPrompt(v), e.target);
    });
    document.getElementById('copyThread').addEventListener('click', (e) => {
      const v = videos.find(x => x.id === modalId);
      if (v) copyText(threadOf(v).join('\n\n'), e.target);
    });
    document.getElementById('closeModal').addEventListener('click', closePrompt);
    document.getElementById('promptModal').addEventListener('click', (e) => {
      if (e.target.id === 'promptModal') closePrompt();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePrompt(); });

    // ---------- updates from X ----------

    function mergeFresh(entry, fresh) {
      // Keep the user's own title/description, refresh everything X owns
      return { ...entry, video: fresh.video, poster: fresh.poster, likes: fresh.likes,
        duration: fresh.duration, width: fresh.width, height: fresh.height,
        thread: fresh.thread ?? entry.thread,
        prompt: entry.promptEdited ? entry.prompt : (fresh.prompt ?? entry.prompt) };
    }

    function freshFor(entry, results) {
      return results.find(r => r.id === entry.id) || results.find(r => r.video.split('?')[0] === entry.video.split('?')[0]) || results[0];
    }

    const repairing = new Set();
    async function repairVideo(id) {
      const entry = videos.find(v => v.id === id);
      if (!entry || !entry.post || repairing.has(id)) return;
      repairing.add(id);
      try {
        const results = await resolvePost(entry.post);
        const fresh = results.length && freshFor(entry, results);
        if (fresh && fresh.video !== entry.video) {
          commit(videos.map(v => v.id === id ? mergeFresh(v, fresh) : v));
        }
      } catch {}
    }

    async function refreshEntries(list, label) {
      const targets = list.filter(v => v.post);
      let done = 0, failed = 0;
      for (const entry of targets) {
        setStatus(`${label} ${++done}/${targets.length}…`);
        try {
          const results = await resolvePost(entry.post);
          const fresh = results.length && freshFor(entry, results);
          if (fresh) videos = videos.map(v => v.id === entry.id ? mergeFresh(v, fresh) : v);
        } catch { failed++; }
      }
      commit(videos);
      setStatus(failed ? `Updated ${targets.length - failed}, ${failed} failed (post deleted or private?)` : `Updated ${targets.length} videos from X.`, failed > 0);
    }

    // ---------- add from X ----------

    document.getElementById('addFromUrl').addEventListener('click', async () => {
      const btn = document.getElementById('addFromUrl');
      const field = document.getElementById('postUrls');
      const urls = field.value.split(/\s+/).filter(u => parsePostUrl(u));
      if (!urls.length) { setStatus('Paste at least one x.com/…/status/… link.', true); return; }

      btn.disabled = true;
      let added = 0, skipped = 0, noVideo = 0, failed = [];
      for (const [i, url] of urls.entries()) {
        setStatus(`Fetching ${i + 1}/${urls.length}…`);
        try {
          const results = await resolvePost(url);
          if (!results.length) { noVideo++; continue; }
          for (const r of results) {
            if (videos.some(v => v.id === r.id || (v.post && parsePostUrl(v.post)?.id === r.id))) { skipped++; continue; }
            videos = [r, ...videos];
            added++;
          }
        } catch (err) {
          failed.push(url);
        }
      }
      commit(videos);
      btn.disabled = false;
      field.value = failed.join('\n');

      const parts = [`Added ${added}`];
      if (skipped) parts.push(`${skipped} already in library`);
      if (noVideo) parts.push(`${noVideo} without video`);
      if (failed.length) parts.push(`${failed.length} failed (left in the box)`);
      setStatus(parts.join(' · '), failed.length > 0 && !added);
    });

    // ---------- manual add, import/export, clear ----------

    document.getElementById('foldToggle').addEventListener('click', (e) => {
      setAllFolded(e.target.getAttribute('aria-pressed') === 'true');
    });

    document.getElementById('toggleAdd').addEventListener('click', () => {
      document.getElementById('addForm').classList.toggle('open');
    });
    document.getElementById('cancelAdd').addEventListener('click', () => {
      document.getElementById('addForm').classList.remove('open');
    });

    document.getElementById('saveVideo').addEventListener('click', () => {
      const title = document.getElementById('fTitle').value.trim();
      const video = document.getElementById('fVideo').value.trim();
      if (!title || !video) {
        alert('Title and video URL are required.');
        return;
      }
      const entry = {
        id: 'v' + Date.now(),
        title,
        author: document.getElementById('fAuthor').value.trim(),
        post: document.getElementById('fPost').value.trim(),
        video,
        poster: document.getElementById('fPoster').value.trim(),
        likes: parseInt(document.getElementById('fLikes').value, 10) || 0,
        desc: document.getElementById('fDesc').value.trim()
      };
      commit([entry, ...videos]);
      document.getElementById('addForm').classList.remove('open');
      document.querySelectorAll('#addForm input, #addForm textarea').forEach(el => el.value = '');
    });

    document.getElementById('refreshAll').addEventListener('click', async (e) => {
      e.target.disabled = true;
      await refreshEntries(videos, 'Refreshing');
      e.target.disabled = false;
    });

    document.getElementById('search').addEventListener('input', render);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify({ videos, external: externals }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'opus55-library.json';
      a.click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          // Older exports are a plain array of videos; newer ones also carry the external libraries
          const imported = Array.isArray(data) ? data : data.videos;
          if (!Array.isArray(imported)) throw new Error('No videos');
          const ext = Array.isArray(data.external) ? data.external : null;
          const what = `${imported.length} videos` + (ext ? ` and ${ext.length} external libraries` : '');
          if (confirm(`Replace current library with ${what}?`)) {
            commit(imported);
            if (ext) commitExternals(ext);
          }
        } catch {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });


    // ---------- external libraries ----------

    const EXT_KEY = 'opus55-external-libraries';
    const EXT_SEED_KEY = 'opus55-external-libraries-seed';
    const EXT_SEED_VERSION = 2;
    const defaultExternals = [
      {
        id: 'takayu-3d-motion-reference',
        name: '3D Motion Reference — Takayu Studio',
        url: 'https://takayustudio.jp/3d-motion-reference/',
        image: 'https://takayustudio.jp/3d-motion-reference/assets/og-image.png',
        note: '227 live 3D demos: depth, object motion, camera work, impacts, light and material, logo/product/game-UI 3D, sound-synced motion. Behind-the-scenes camera view, build notes for Three.js, CSS, After Effects and Blender. (Japanese)'
      },
      {
        id: 'takayu-motion-reference',
        name: 'Motion Reference — Takayu Studio',
        url: 'https://motion-reference.takayustudio.jp/',
        image: 'https://motion-reference.takayustudio.jp/assets/og-image.png',
        note: 'Motion and easing dictionary: 782 demos searchable by name, speed, easing and feel. UI, games, scroll, forms, gestures, SVG, principles, springs, camera and transitions; 228 text motions with CSS, GSAP and After Effects how-tos. (Japanese)'
      }
    ];

    function loadExternals() {
      let list;
      try {
        const raw = localStorage.getItem(EXT_KEY);
        list = raw ? JSON.parse(raw) : defaultExternals.map(e => ({ ...e }));
        // Merge new built-in sources into an existing list once per seed version
        if ((Number(localStorage.getItem(EXT_SEED_KEY)) || 0) < EXT_SEED_VERSION) {
          const have = new Set(list.map(e => e.id));
          list = [...list, ...defaultExternals.filter(d => !have.has(d.id)).map(d => ({ ...d }))];
          localStorage.setItem(EXT_KEY, JSON.stringify(list));
          localStorage.setItem(EXT_SEED_KEY, String(EXT_SEED_VERSION));
        }
      } catch {
        list = list || defaultExternals.map(e => ({ ...e }));
      }
      return list;
    }

    let externals = loadExternals();

    function commitExternals(list) {
      externals = list;
      try { localStorage.setItem(EXT_KEY, JSON.stringify(externals)); } catch {}
      renderExternals();
    }

    function domainOf(url) {
      try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
    }

    function renderExternals() {
      document.getElementById('extCount').textContent = `(${externals.length})`;
      const box = document.getElementById('extList');
      if (!externals.length) {
        box.innerHTML = '<div class="empty">No external libraries yet. Click \u201c+ Add library\u201d.</div>';
        return;
      }
      box.innerHTML = externals.map(e => `
        <div class="ext-card">
          <a class="ext-link" href="${safeUrl(e.url)}" target="_blank" rel="noopener">
            <div class="ext-thumb">${safeUrl(e.image) ? `<img src="${safeUrl(e.image)}" alt="" loading="lazy">` : escapeHtml(domainOf(e.url))}</div>
            <div class="ext-body">
              <h3>${escapeHtml(e.name || domainOf(e.url))}</h3>
              <div class="ext-domain">${escapeHtml(domainOf(e.url))}</div>
              <div class="ext-note">${escapeHtml(e.note || '')}</div>
            </div>
          </a>
          <button class="remove-btn" data-ext="${escapeHtml(e.id)}" aria-label="Remove ${escapeHtml(e.name || domainOf(e.url))}">Remove</button>
        </div>`).join('');
      box.querySelectorAll('[data-ext]').forEach(btn => {
        btn.addEventListener('click', () => commitExternals(externals.filter(e => e.id !== btn.dataset.ext)));
      });
      // A preview image that fails to load falls back to the domain
      box.querySelectorAll('.ext-thumb img').forEach(img => {
        img.addEventListener('error', () => { img.parentElement.textContent = domainOf(img.closest('a').href); }, { once: true });
      });
    }

    document.getElementById('toggleExtAdd').addEventListener('click', () => {
      document.getElementById('extForm').classList.toggle('open');
      document.getElementById('extUrl').focus();
    });
    document.getElementById('cancelExt').addEventListener('click', () => {
      document.getElementById('extForm').classList.remove('open');
    });
    document.getElementById('saveExt').addEventListener('click', () => {
      let url = document.getElementById('extUrl').value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (!/^https?:\/\/[^\s.]+\.[^\s]+/i.test(url)) { alert('Please enter a website URL.'); return; }
      if (externals.some(e => e.url.replace(/\/$/, '') === url.replace(/\/$/, ''))) { alert('This library is already in the list.'); return; }
      commitExternals([...externals, {
        id: 'x' + Date.now(),
        name: document.getElementById('extName').value.trim(),
        url,
        image: document.getElementById('extImage').value.trim(),
        note: document.getElementById('extNote').value.trim()
      }]);
      document.getElementById('extForm').classList.remove('open');
      document.querySelectorAll('#extForm input, #extForm textarea').forEach(el => el.value = '');
    });

    // ---------- init ----------

    render();
    renderExternals();
    // Backfill posters/prompts for entries that never had them (e.g. the starter set, older saves)
    const missing = videos.filter(v => v.post && (!v.poster || !('thread' in v)));
    if (missing.length) refreshEntries(missing, 'Loading previews');
  </script>
</body>
</html>
